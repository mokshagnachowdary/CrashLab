
services:
  - type: web
    name: crashlab-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crashlab-db
          property: connectionString

      - key: CORS_ORIGINS
        value: https://crashlab-qrqs.onrender.com

      - key: ARTIFACT_URL
        sync: false

      - key: CRASHLAB_MAX_SCENARIOS
        value: "5000"

      - key: CRASHLAB_WORKERS
        value: "1"

databases:
  - name: crashlab-db
    databaseName: crashlab
    user: crashlab
    plan: free
    region: oregon
